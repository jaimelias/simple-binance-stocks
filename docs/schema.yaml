openapi: 3.0.2
info:
  title: Stocks Trading REST API
  description: REST APIs for Binance Stocks Trading. All endpoints under `/sapi/v1/equity/*`.
  x-description-cn: Binance 股票交易 REST API。所有接口位于 `/sapi/v1/equity/*`。
  version: 1.0.0
  termsOfService: https://www.binance.com/en/terms
  contact:
    name: Binance API Support
    url: https://www.binance.com/en/support
x-product-type: rest-api
x-rate-limits-guide: products/stocks/general-info#rate-limits
x-rate-limits-guide-cn: products/stocks/general-info#频率限制
x-security-guide: products/stocks/general-info#signed-trade-and-user_data-endpoint-security
x-security-guide-cn: products/stocks/general-info#枚举契约
x-api-key-guide: https://www.binance.com/en/support/faq/detail/360002502072
x-api-key-guide-cn: https://www.binance.com/cn/support/faq/detail/360002502072
externalDocs:
  description: Stocks Trading docs
  url: https://developers.binance.com/en/docs/products/stocks/introduction
tags:
  - name: market-data
    x-displayName: Market Data
    x-displayName-cn: 行情接口
  - name: trade
    x-displayName: Trade
    x-displayName-cn: 交易接口
  - name: tokenized
    x-displayName: Tokenized
    x-displayName-cn: 代币化接口
  - name: account
    x-displayName: Account
    x-displayName-cn: 账户接口
  - name: user-data-streams
    x-displayName: User Data Streams
    x-displayName-cn: 用户数据流
servers:
  - url: https://api.binance.com
paths:
  /sapi/v1/equity/market/exchangeInfo:
    get:
      summary: Exchange Info (MARKET_DATA)
      x-summary-cn: 交易规则与 Symbol 列表 (MARKET_DATA)
      description: >-
        Returns current exchange trading rules and the list of tradable US-equity symbols. MARKET_DATA endpoint —
        requires an API key (`X-MBX-APIKEY`) but no signature. Response is served from a server-side cache.
      x-description-cn: 返回当前交易规则与可交易美股 Symbol 列表。MARKET_DATA 接口——需携带 API key（`X-MBX-APIKEY`），但无需签名。响应来自服务端缓存。
      tags:
        - market-data
      operationId: exchangeInfo
      externalDocs:
        url: >-
          https://developers.binance.com/en/docs/catalog/advanced-trading-stocks-trading/api/rest-api/market-data#exchange-info
      x-connectors-examples:
        ts: >-
          https://raw.githubusercontent.com/binance/binance-connector-js/master/clients/stocks/examples/rest-api/MarketDataApi/exchangeInfo.ts
        rust: >-
          https://raw.githubusercontent.com/binance/binance-connector-rust/main/examples/stocks/rest_api/market_data_api/exchange_info.rs
        python: >-
          https://raw.githubusercontent.com/binance/binance-connector-python/master/clients/stocks/examples/rest_api/MarketData/exchange_info.py
        java: >-
          https://raw.githubusercontent.com/binance/binance-connector-java/master/examples/stocks/src/main/java/com/binance/connector/client/stocks/rest/marketdata/ExchangeInfoExample.java
        go: >-
          https://raw.githubusercontent.com/binance/binance-connector-go/main/clients/stocks/examples/restapi/MarketDataAPI/ExchangeInfo/ExchangeInfo.go
        php: >-
          https://raw.githubusercontent.com/binance/binance-connector-php/master/examples/stocks/marketdata/ExchangeInfoExample.php
      x-security-type: MARKET_DATA
      x-weight: 1
      parameters:
        - name: X-MBX-APIKEY
          in: header
          required: true
          description: >-
            An API Key is required to access this endpoint and must be included in the request headers. To create an API
            Key, refer to:
            [https://www.binance.com/en/support/faq/detail/360002502072](https://www.binance.com/en/support/faq/detail/360002502072).
          x-description-cn: >-
            访问此接口需要 API Key，并且必须在请求头中携带。关于如何创建 API
            Key，请参考：[https://www.binance.com/cn/support/faq/detail/360002502072](https://www.binance.com/cn/support/faq/detail/360002502072)。
          schema:
            type: string
            example: API_KEY
        - name: symbol
          in: query
          required: false
          schema:
            type: string
            example: AAPL
          description: >-
            Filter to a single US-equity ticker, e.g. `AAPL`. When omitted, returns all active symbols. An unknown
            ticker returns an empty `symbols` array (HTTP 200), not an error.
          x-description-cn: 过滤单只美股 ticker，例如 `AAPL`。省略时返回所有上架 symbol。未知 ticker 返回空 `symbols` 数组（HTTP 200），而非报错。
      responses:
        "200":
          description: Exchange Info
          x-description-cn: 交易规则与 Symbol 列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  timezone:
                    type: string
                    example: UTC
                    description: Always `UTC`.
                    x-description-cn: 固定为 `UTC`。
                  symbols:
                    type: array
                    description: List of tradable symbols with trading rules.
                    x-description-cn: 可交易 symbol 列表及其交易规则。
                    items:
                      type: object
                      properties:
                        symbol:
                          type: string
                          example: AAPL
                          description: US-equity ticker, e.g. `AAPL`.
                          x-description-cn: 美股 ticker，例如 `AAPL`。
                        tradability:
                          type: string
                          example: BUY_SELL
                          enum:
                            - BUY_SELL
                            - BUY
                            - SELL
                            - NONE
                          description: Trading direction allowed — one of `BUY_SELL` / `BUY` / `SELL` / `NONE`.
                          x-description-cn: 允许的交易方向，取值之一：`BUY_SELL` / `BUY` / `SELL` / `NONE`。
                        tradabilityUpdateTime:
                          type: integer
                          format: int64
                          example: 1735900000000
                          description: Last time the `tradability` value was updated (ms epoch).
                          x-description-cn: "`tradability` 值最后更新时间（毫秒时间戳）。"
                        overnightSupported:
                          type: boolean
                          example: true
                          description: Whether the symbol supports overnight trading.
                          x-description-cn: 该 symbol 是否支持夜盘交易。
                        fractionable:
                          type: boolean
                          example: true
                          description: Whether fractional shares are supported during the regular session.
                          x-description-cn: 常规时段是否支持分数股。
                        fractionableEh:
                          type: boolean
                          example: false
                          description: Whether fractional shares are supported during extended hours.
                          x-description-cn: 延长时段是否支持分数股。
                        extendedSession:
                          type: boolean
                          example: true
                          description: Whether extended-session trading is enabled.
                          x-description-cn: 是否启用延长时段交易。
                        maxNumOrders:
                          type: integer
                          example: 200
                          description: Maximum number of open orders a user may have for this symbol.
                          x-description-cn: 用户对此 symbol 可持有的最大挂单数。
                        stepSize:
                          type: string
                          example: "0.000000001"
                          description: Lot size — minimum increment for `quantity`.
                          x-description-cn: "`quantity` 的最小步长（手数）。"
                        multiplierUp:
                          type: string
                          example: "1.10"
                          description: Upper price multiplier limit relative to reference.
                          x-description-cn: 相对参考价格的上限倍率。
                        multiplierDown:
                          type: string
                          example: "0.90"
                          description: Lower price multiplier limit relative to reference.
                          x-description-cn: 相对参考价格的下限倍率。
                        minQty:
                          type: string
                          example: "0.000000001"
                          description: Minimum allowed `quantity`.
                          x-description-cn: 允许的最小 `quantity`。
                        maxQty:
                          type: string
                          example: "100000.00000000"
                          description: Maximum allowed `quantity`.
                          x-description-cn: 允许的最大 `quantity`。
                        minNotional:
                          type: string
                          example: "1.00"
                          description: Minimum order notional (USD).
                          x-description-cn: 最小订单名义金额（USD）。
                        maxNotional:
                          type: string
                          example: "1000000.00"
                          description: Maximum order notional (USD).
                          x-description-cn: 最大订单名义金额（USD）。
                        listingTime:
                          type: integer
                          format: int64
                          example: 1700000000000
                          description: Listing timestamp (ms epoch).
                          x-description-cn: 上架时间（毫秒时间戳）。
                        delistingTime:
                          type: integer
                          format: int64
                          nullable: true
                          example: null
                          description: Scheduled delisting timestamp (ms epoch); `null` if not scheduled for delisting.
                          x-description-cn: 计划下架时间（毫秒时间戳）；未计划下架时为 `null`。
  /sapi/v1/equity/market/tokenized-assets:
    get:
      summary: Tokenized Assets (MARKET_DATA)
      x-summary-cn: 代币化资产列表 (MARKET_DATA)
      description: >-
        Returns the list of all tokenized assets currently available for mint / redeem, together with each asset's
        underlying equity symbol and conversion multiplier. MARKET_DATA endpoint — requires an API key (`X-MBX-APIKEY`)
        but no signature. Response is served from a server-side cache.
      x-description-cn: 返回当前可铸造 / 赎回的全部代币化资产列表，包含每个资产的标的美股 Symbol 和转换倍数。MARKET_DATA 接口——需携带 API key（`X-MBX-APIKEY`），但无需签名。响应来自服务端缓存。
      tags:
        - market-data
      operationId: tokenizedAssets
      externalDocs:
        url: >-
          https://developers.binance.com/en/docs/catalog/advanced-trading-stocks-trading/api/rest-api/market-data#tokenized-assets
      x-connectors-examples:
        ts: >-
          https://raw.githubusercontent.com/binance/binance-connector-js/master/clients/stocks/examples/rest-api/MarketDataApi/tokenizedAssets.ts
        rust: >-
          https://raw.githubusercontent.com/binance/binance-connector-rust/main/examples/stocks/rest_api/market_data_api/tokenized_assets.rs
        python: >-
          https://raw.githubusercontent.com/binance/binance-connector-python/master/clients/stocks/examples/rest_api/MarketData/tokenized_assets.py
        java: >-
          https://raw.githubusercontent.com/binance/binance-connector-java/master/examples/stocks/src/main/java/com/binance/connector/client/stocks/rest/marketdata/TokenizedAssetsExample.java
        go: >-
          https://raw.githubusercontent.com/binance/binance-connector-go/main/clients/stocks/examples/restapi/MarketDataAPI/TokenizedAssets/TokenizedAssets.go
        php: >-
          https://raw.githubusercontent.com/binance/binance-connector-php/master/examples/stocks/marketdata/TokenizedAssetsExample.php
      x-security-type: MARKET_DATA
      x-weight: 1
      parameters:
        - name: X-MBX-APIKEY
          in: header
          required: true
          description: >-
            An API Key is required to access this endpoint and must be included in the request headers. To create an API
            Key, refer to:
            [https://www.binance.com/en/support/faq/detail/360002502072](https://www.binance.com/en/support/faq/detail/360002502072).
          x-description-cn: >-
            访问此接口需要 API Key，并且必须在请求头中携带。关于如何创建 API
            Key，请参考：[https://www.binance.com/cn/support/faq/detail/360002502072](https://www.binance.com/cn/support/faq/detail/360002502072)。
          schema:
            type: string
            example: API_KEY
      responses:
        "200":
          description: Tokenized Assets
          x-description-cn: 代币化资产列表
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    assetCode:
                      type: string
                      example: AAPLB
                      description: Tokenized asset code, e.g. `AAPLB`.
                      x-description-cn: 代币化资产代码，例如 `AAPLB`。
                    assetName:
                      type: string
                      example: Apple Inc. Tokenized Stock
                      description: Human-readable display name of the tokenized asset.
                      x-description-cn: 代币化资产的人类可读名称。
                    underlyingEquitySymbol:
                      type: string
                      example: AAPL
                      description: >-
                        Underlying US-equity ticker, e.g. `AAPL`. Use this when calling `/tokenized/mint` or
                        `/tokenized/redeem`.
                      x-description-cn: 标的美股 ticker，例如 `AAPL`。调用 `/tokenized/mint` 或 `/tokenized/redeem` 时使用此字段。
                    multiplier:
                      type: string
                      example: "1"
                      description: Conversion multiplier between the underlying equity and the tokenized asset.
                      x-description-cn: 标的股票与代币化资产之间的转换倍数。
                    multiplierValid:
                      type: boolean
                      example: true
                      description: Whether the multiplier is currently valid and applicable.
                      x-description-cn: 当前倍数是否有效且可适用。
  /sapi/v1/equity/market/quote:
    get:
      summary: Latest Quote (MARKET_DATA)
      x-summary-cn: 最新报价 (MARKET_DATA)
      description: >-
        Returns the latest best bid / best ask for a single US-equity ticker. The returned value is at most ~5 seconds
        stale. Returns an **empty response body** (not the literal `null`) when no quote is available for the supplied
        ticker (e.g. the ticker is unknown, halted, or de-listed).
      x-description-cn: 返回单只美股的最优买一 / 卖一报价，数据最多延迟约 5 秒。当指定 ticker 没有可用报价时（如未知、停牌或已下架）返回**空响应体**（非字面 `null`，客户端需容错）。
      tags:
        - market-data
      operationId: latestQuote
      externalDocs:
        url: >-
          https://developers.binance.com/en/docs/catalog/advanced-trading-stocks-trading/api/rest-api/market-data#latest-quote
      x-connectors-examples:
        ts: >-
          https://raw.githubusercontent.com/binance/binance-connector-js/master/clients/stocks/examples/rest-api/MarketDataApi/latestQuote.ts
        rust: >-
          https://raw.githubusercontent.com/binance/binance-connector-rust/main/examples/stocks/rest_api/market_data_api/latest_quote.rs
        python: >-
          https://raw.githubusercontent.com/binance/binance-connector-python/master/clients/stocks/examples/rest_api/MarketData/latest_quote.py
        java: >-
          https://raw.githubusercontent.com/binance/binance-connector-java/master/examples/stocks/src/main/java/com/binance/connector/client/stocks/rest/marketdata/LatestQuoteExample.java
        go: >-
          https://raw.githubusercontent.com/binance/binance-connector-go/main/clients/stocks/examples/restapi/MarketDataAPI/LatestQuote/LatestQuote.go
        php: >-
          https://raw.githubusercontent.com/binance/binance-connector-php/master/examples/stocks/marketdata/LatestQuoteExample.php
      x-security-type: MARKET_DATA
      x-weight: 1
      parameters:
        - name: X-MBX-APIKEY
          in: header
          required: true
          description: >-
            An API Key is required to access this endpoint and must be included in the request headers. To create an API
            Key, refer to:
            [https://www.binance.com/en/support/faq/detail/360002502072](https://www.binance.com/en/support/faq/detail/360002502072).
          x-description-cn: >-
            访问此接口需要 API Key，并且必须在请求头中携带。关于如何创建 API
            Key，请参考：[https://www.binance.com/cn/support/faq/detail/360002502072](https://www.binance.com/cn/support/faq/detail/360002502072)。
          schema:
            type: string
            example: API_KEY
        - name: symbol
          in: query
          required: true
          schema:
            type: string
            example: AAPL
          description: US-equity ticker, e.g. `AAPL`, `TSLA`. Case-insensitive; uppercased server-side.
          x-description-cn: 美股 ticker，例如 `AAPL`、`TSLA`。大小写不敏感，服务端统一转为大写。
      responses:
        "200":
          description: Latest Quote
          x-description-cn: 最新报价
          content:
            application/json:
              schema:
                type: object
                nullable: true
                properties:
                  symbol:
                    type: string
                    example: AAPL
                    description: US-equity ticker.
                    x-description-cn: 美股 ticker。
                  bidPrice:
                    type: string
                    example: "180.50"
                    description: Best bid price (USD).
                    x-description-cn: 最优买一价（USD）。
                  askPrice:
                    type: string
                    example: "180.52"
                    description: Best ask price (USD).
                    x-description-cn: 最优卖一价（USD）。
                  bidSize:
                    type: integer
                    example: 100
                    description: Best bid size (shares).
                    x-description-cn: 最优买一量（股数）。
                  askSize:
                    type: integer
                    example: 200
                    description: Best ask size (shares).
                    x-description-cn: 最优卖一量（股数）。
  /sapi/v1/equity/order/place:
    post:
      summary: Place Equity Order (TRADE)
      x-summary-cn: 下单 (TRADE)
      description: |-
        Place a new equity order. Supports all combinations of `LIMIT` /
        `MARKET` × `BUY` / `SELL`. For `LIMIT BUY` orders the commission fee is
        automatically computed and reserved by the server at placement time —
        callers submit `price` and `quantity` only, no `fee` field is required.


        **Field combination matrix**


        | Side | OrderType | Required | Forbidden |
        | ---- | --------- | -------- | --------- |
        | BUY | LIMIT | `price`, `quantity`, `tradingSession` | `notional` |
        | BUY | MARKET | `notional` | `price`, `quantity`, `tradingSession` |
        | SELL | LIMIT | `price`, `quantity`, `tradingSession` | `notional` |
        | SELL | MARKET | `quantity` | `price`, `notional`, `tradingSession` |


        **Fractional shares**: when `quantity` has a decimal component, or an
        order is placed by `notional`, it is treated as a fractional-share
        order. A fractional-share `GTC` order must be paired with
        `tradingSession = EXTENDED` or `24H`.


        Rate limit: 200 requests / min (UID).
      x-description-cn: |-
        下一笔股票订单。支持 `LIMIT` / `MARKET` × `BUY` / `SELL`
        的所有组合。对于 `LIMIT BUY`
        订单，服务端在下单时自动计算并冻结手续费——调用方只需提交 `price` 和
        `quantity`，无需传 `fee` 字段。


        **字段组合矩阵**


        | Side | OrderType | 必填 | 禁传 |
        | ---- | --------- | ---- | ---- |
        | BUY | LIMIT | `price`、`quantity`、`tradingSession` | `notional` |
        | BUY | MARKET | `notional` | `price`、`quantity`、`tradingSession` |
        | SELL | LIMIT | `price`、`quantity`、`tradingSession` | `notional` |
        | SELL | MARKET | `quantity` | `price`、`notional`、`tradingSession` |


        **碎股**：当 `quantity` 带小数，或使用 `notional`
        下单时，订单被视为碎股订单。碎股 `GTC` 订单必须搭配 `tradingSession =
        EXTENDED` 或 `24H`。


        频率限制：200 次 / 分钟（UID）。
      tags:
        - trade
      operationId: placeEquityOrder
      externalDocs:
        url: >-
          https://developers.binance.com/en/docs/catalog/advanced-trading-stocks-trading/api/rest-api/trade#place-equity-order
      x-connectors-examples:
        ts: >-
          https://raw.githubusercontent.com/binance/binance-connector-js/master/clients/stocks/examples/rest-api/TradeApi/placeEquityOrder.ts
        rust: >-
          https://raw.githubusercontent.com/binance/binance-connector-rust/main/examples/stocks/rest_api/trade_api/place_equity_order.rs
        python: >-
          https://raw.githubusercontent.com/binance/binance-connector-python/master/clients/stocks/examples/rest_api/Trade/place_equity_order.py
        java: >-
          https://raw.githubusercontent.com/binance/binance-connector-java/master/examples/stocks/src/main/java/com/binance/connector/client/stocks/rest/trade/PlaceEquityOrderExample.java
        go: >-
          https://raw.githubusercontent.com/binance/binance-connector-go/main/clients/stocks/examples/restapi/TradeAPI/PlaceEquityOrder/PlaceEquityOrder.go
        php: >-
          https://raw.githubusercontent.com/binance/binance-connector-php/master/examples/stocks/trade/PlaceEquityOrderExample.php
      x-security-type: TRADE
      x-signed: true
      x-weight: 1
      parameters:
        - name: X-MBX-APIKEY
          in: header
          required: true
          description: >-
            An API Key is required to access this endpoint and must be included in the request headers. To create an API
            Key, refer to:
            [https://www.binance.com/en/support/faq/detail/360002502072](https://www.binance.com/en/support/faq/detail/360002502072).
          x-description-cn: >-
            访问此接口需要 API Key，并且必须在请求头中携带。关于如何创建 API
            Key，请参考：[https://www.binance.com/cn/support/faq/detail/360002502072](https://www.binance.com/cn/support/faq/detail/360002502072)。
          schema:
            type: string
            example: API_KEY
        - name: symbol
          in: query
          required: true
          schema:
            type: string
            example: AAPL
          description: >-
            US stock ticker, e.g. `AAPL`, `TSLA`. Must be a tradable US-equity symbol — verify via
            `/sapi/v1/equity/market/exchangeInfo`. Tokenization enablement (verifiable via
            `/sapi/v1/equity/market/tokenized-assets`) is *not* required; non-tokenized symbols are accepted and settle
            as traditional underlying-equity trades. The `tokenize` parameter only takes effect on tokenization-enabled
            symbols and is silently ignored otherwise.
          x-description-cn: >-
            美股 ticker，如 `AAPL`、`TSLA`。必须是可交易的美股 symbol——可通过 `/sapi/v1/equity/market/exchangeInfo` 查询。是否已开启代币化（可通过
            `/sapi/v1/equity/market/tokenized-assets` 查询）*并非*必要条件；未开启代币化的 symbol 同样可以下单，并以传统的底层股票交易方式结算。`tokenize` 参数仅在
            symbol 已开启代币化时生效，否则会被静默忽略。
        - name: quoteAsset
          in: query
          required: false
          schema:
            type: string
            example: USDC
          description: Quote asset. Defaults to `USDC`; must be within the server's allowed set.
          x-description-cn: 计价资产，默认 `USDC`；必须在服务端允许集合内。
        - name: side
          in: query
          required: true
          schema:
            type: string
            enum:
              - BUY
              - SELL
            example: BUY
          description: "`BUY` / `SELL`."
          x-description-cn: "`BUY` / `SELL`。"
        - name: orderType
          in: query
          required: true
          schema:
            type: string
            enum:
              - MARKET
              - LIMIT
            example: LIMIT
          description: "`MARKET` / `LIMIT`."
          x-description-cn: "`MARKET` / `LIMIT`。"
        - name: price
          in: query
          required: false
          schema:
            type: string
            example: "180.50"
          description: "**Required** for `LIMIT`; **forbidden** for `MARKET`. Maximum 2 decimal places."
          x-description-cn: "`LIMIT` **必填**；`MARKET` **禁传**。最多 2 位小数。"
        - name: quantity
          in: query
          required: false
          schema:
            type: string
