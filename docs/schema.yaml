  /sapi/v1/equity/tokenized/mint:
    post:
      summary: Tokenized Mint (TRADE)
      x-summary-cn: 铸造代币化资产 (TRADE)
      description: >-
        Mint a tokenized asset from an underlying equity holding. The caller's underlying equity (e.g. `AAPL`) is burned
        (or locked), and the corresponding tokenized asset (e.g. `AAPLB`) is credited. The tokenized asset is resolved
        server-side from `underlyingAsset`; callers only provide the underlying ticker and quantity. Mint is
        asynchronous: the endpoint returns an `issuerRequestId` immediately with a transient status; poll
        `/tokenized/convert-status` to observe the terminal state, or inspect `/tokenized/history` for the full record.
        Rate limit: 50 requests / min (UID).
      x-description-cn: >-
